services:
  socket_server:
    build: .
    container_name: pcs_socket_engine
    command: python server.py
    ports:
      - "5000:5000"
    environment:
      - AUTH_TOKEN=production_secret_key

  rest_api:
    build: .
    container_name: pcs_rest_api
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - socket_server
      - redis_queue
    environment:
      - AUTH_TOKEN=production_secret_key
      
  redis_queue:
    image: redis:7-alpine
    container_name: pcs_redis
    ports:
      - "6379:6379"

  async_worker:
    build: .
    container_name: pcs_async_worker
    command: python worker.py
    depends_on:
      - redis_queue

  prometheus:
    image: prom/prometheus:latest
    container_name: pcs_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - rest_api

  grafana:
    image: grafana/grafana:latest
    container_name: pcs_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
